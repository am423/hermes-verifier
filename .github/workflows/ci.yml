name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Hermes
        # Downloads the installer to a file, then runs it from that file rather
        # than piping curl into a shell — no pipe-to-shell in the tree.
        # Hermes must be importable because runtime.py imports agent.plugin_llm
        # to detect trust-gate errors.
        run: |
          curl -fsSL -o /tmp/hermes-install.sh https://hermes-agent.nousresearch.com/install.sh
          bash /tmp/hermes-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install test deps
        run: python -m pip install pytest pyyaml jsonschema
      - name: Run tests
        run: python -m pytest -q
      - name: Run offline analysis tests
        run: python -m pytest -q autoresearch/tests
      - name: Validate plugin (the catalog admission gate)
        # validate exits non-zero on error by itself; --ci is a doctor flag.
        run: hermes plugins validate . --install-deps
      - name: Doctor the plugin
        run: hermes plugins doctor . --ci
