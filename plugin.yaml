name: hermes-verifier
version: 0.4.1
description: >-
  Attach an independent verifier model to your Hermes session: it reviews each
  primary-agent turn delta, verifies claims with read-only tools, raises findings
  (note / caution / blocker), and steers them back into the session before the
  primary agent goes wrong.
author: "am423"
license: MIT
manifest_version: 2
api_version: 1
requires_hermes: ">=0.21.5"
homepage: https://github.com/am423/hermes-verifier
tags: [desktop, session, review, verifier]
provides_hooks:
  - post_llm_call
  - pre_tool_call
  - pre_llm_call
  - pre_verify
  - on_session_reset
capabilities:
  - llm.model_override
config_schema:
  enabled:
    type: bool
    default: false
    description: "Run the verifier after every primary turn. Default off; toggle per session with /verify on."
  verifier_model:
    type: str
    default: ""
    # `choices` is what makes this a DROPDOWN. The host turns "type: str" plus a
    # non-empty choices list into an enum field
    # (hermes_cli/plugins_settings.py::_field_type), and the settings form renders
    # an enum as a Select (apps/desktop/.../plugin-settings-form.tsx::EnumControl).
    # Without it this was a free-text box, so the models the plugin is allowed to
    # call were undiscoverable from the UI.
    #
    # Note the trade: the settings form validates an enum against this list, so a
    # model NOT listed here cannot be saved FROM THE FORM. Editing config.yaml or
    # the Verifier Mode titlebar picker (which reads the live catalog) still takes
    # any model. Add entries here to widen the dropdown.
    choices:
    - nous/anthropic/claude-opus-5.5
    - nous/anthropic/claude-sonnet-5
    - openai-codex/gpt-6.1-sol
    - openai-codex/gpt-6.1-sol-pro
    - openai-codex/gpt-6-sol
    - openai-codex/gpt-6-astra
    - openai-codex/gpt-6-astra-pro
    - deepseek/deepseek-flash
    - deepseek/deepseek-v4-pro
    description: "Verifier model as 'provider/model' or a plain model id. Empty = the session's primary model. ('model' is a reserved settings root, hence the prefix.)"
  verifier_session:
    type: str
    default: ""
    description: "Designated Verifier Mode session (managed by the desktop UI; do not edit by hand)."
  sync_backlog:
    type: str
    default: "off"
    description: "Catch-up pacing when the verifier falls behind: any digit 1-5 (0/off disables). 1 is closest to synchronous review."
  immunity_turns:
    type: int
    default: 3
    description: "Primary turns after an interrupting finding before another may interrupt."
  max_delta_chars:
    type: int
    default: 20000
    description: "Cap on the rendered transcript delta sent to the advisor, in CHARACTERS. Measured: the provider bills ~1.60 chars/token on agent transcripts, so 20000 chars is roughly 12,500 billed tokens per review. Lower it to cut cost."
  blocker_steer:
    type: bool
    default: true
    description: "Let a blocker finding keep a coding turn alive via the pre-verify gate."
  advisor_tools:
    type: bool
    default: false
    description: "Let advisors verify claims with read-only tools (read_file, search_files) instead of reviewing prose alone. This global switch is what enables the feature: a roster entry can grant tools to its own advisor, but only while this is on. Off by default."
  default_tools:
    type: list
    default: []
    description: "Read-only tools granted to the DEFAULT verifier when advisor_tools is on. Only read_file and search_files are permitted; anything else is refused."
  max_reviews_per_session:
    type: int
    default: 0
    description: "Hard cap on advisor reviews per session; 0 = unlimited. Mirrors Claude Code's max_uses cost control."
  gate_enabled:
    type: bool
    default: false
    description: "Let a cheap model call decide whether each turn gets reviewed at all, and at what effort. Measured at ~180 input tokens per decision against ~9,500 for the review it can skip, and validated on 44 labelled cases with 0 dangerous actions skipped. FAIL-SAFE: any error, timeout, empty or unparseable reply engages the review at deep effort. Off by default."
  phase_gate_enabled:
    type: bool
    default: false
    description: "Review an IMPENDING high-risk tool call and veto it before it runs, instead of commenting after the turn. Fires on irreversible or external actions only (rm -rf, DROP TABLE, force-push, publish/deploy, service restarts) -- MEASURED at ~9-10% of turns, and those turns are followed by repair work 41% of the time against a 24% base rate (1.7x). Fails OPEN: if the gate cannot reach its model, the call proceeds. Off by default."
  phase_max_per_turn:
    type: int
    default: 1
    description: "Cap on phase-gate checks per turn, so a turn full of risky commands cannot run up unbounded review spend."
  agreement_reviews:
    type: int
    default: 1
    description: "Run each review this many times and deliver a finding only when agreement_min of them raise it. 1 = off. MEASURED: at 3 with agreement_min 3, the deepseek x baseline configuration went from 67% false alarms to 17% while keeping 72% of findings -- the only operating point measured below the ~30% rate at which the Coverity data says users stop reading a reviewer at all. Only helps models whose false alarms are NOISY (vary run to run); a model whose false alarms are systematic is unaffected, because agreement cannot filter a consistent error. Costs this many times the review price."
  agreement_min:
    type: int
    default: 1
    description: "How many of agreement_reviews must raise a finding for it to be delivered. 1 = off. Set equal to agreement_reviews for the strictest filter."
  advisor_routine_tokens:
    type: int
    default: 1024
    description: "Output-token budget for a review the gate tiered 'routine'. Never applied below 1024: under that floor a response truncates mid-JSON and the whole review is lost."
  advisor_max_tokens:
    type: int
    default: 0
    description: "Cap the advisor model's output tokens per review; 0 = provider default. Mirrors Claude Code's advisor max_tokens. Minimum 1024 when set."
  nudge_first_turns:
    type: int
    default: 0
    description: "Inject a consultation reminder into the first N turns of a session. Claude Code found +7pp on Haiku-class executors, neutral on Sonnet, slightly negative on Opus. 0 = off."
