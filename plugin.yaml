name: hermes-verifier
version: 0.3.0
description: >-
  Attach an independent verifier model to your Hermes session: it reviews each
  primary-agent turn delta, verifies claims with read-only tools, raises findings
  (note / caution / blocker), and steers them back into the session before the
  primary agent goes wrong.
author: "am423"
license: MIT
manifest_version: 2
api_version: 1
requires_hermes: ">=0.21.5"
homepage: https://github.com/am423/hermes-verifier
tags: [desktop, session, review, verifier]
provides_hooks:
  - post_llm_call
  - pre_llm_call
  - pre_verify
  - on_session_reset
capabilities:
  - llm.model_override
config_schema:
  enabled:
    type: bool
    default: false
    description: "Run the verifier after every primary turn. Default off; toggle per session with /verify on."
  verifier_model:
    type: str
    default: ""
    description: "Verifier model as 'provider/model' or a plain model id. Empty = the session's primary model. ('model' is a reserved settings root, hence the prefix.)"
  verifier_session:
    type: str
    default: ""
    description: "Designated Verifier Mode session (managed by the desktop UI; do not edit by hand)."
  sync_backlog:
    type: str
    default: "off"
    description: "Catch-up pacing when the verifier falls behind: off|1|3|5 turns. 1 is closest to synchronous review."
  immunity_turns:
    type: int
    default: 3
    description: "Primary turns after an interrupting finding before another may interrupt."
  max_delta_chars:
    type: int
    default: 20000
    description: "Cap on the rendered transcript delta sent to the advisor, in CHARACTERS. Measured: the provider bills ~1.60 chars/token on agent transcripts, so 20000 chars is roughly 12,500 billed tokens per review. Lower it to cut cost."
  blocker_steer:
    type: bool
    default: true
    description: "Let a blocker finding keep a coding turn alive via the pre-verify gate."
  advisor_tools:
    type: bool
    default: false
    description: "Let advisors verify claims with read-only tools (read_file, search_files) instead of reviewing prose alone. Off by default; a roster entry may enable it per advisor."
  default_tools:
    type: list
    default: []
    description: "Read-only tools granted to the DEFAULT verifier when advisor_tools is on. Only read_file and search_files are permitted; anything else is refused."
  max_reviews_per_session:
    type: int
    default: 0
    description: "Hard cap on advisor reviews per session; 0 = unlimited. Mirrors Claude Code's max_uses cost control."
  advisor_max_tokens:
    type: int
    default: 0
    description: "Cap the advisor model's output tokens per review; 0 = provider default. Mirrors Claude Code's advisor max_tokens. Minimum 1024 when set."
  nudge_first_turns:
    type: int
    default: 0
    description: "Inject a consultation reminder into the first N turns of a session. Claude Code found +7pp on Haiku-class executors, neutral on Sonnet, slightly negative on Opus. 0 = off."
