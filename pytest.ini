[pytest]
testpaths = tests
# The repo root IS the plugin package and its directory name contains a
# hyphen. Any import mode that walks a package chain through it fails
# (pytest derives an unusable module name for the root __init__.py).
# importlib mode derives test module names from the rootdir-RELATIVE path
# (tests.test_guard), so the chain stops at the tests package and the root
# package is never imported by pytest.
addopts = --import-mode=importlib
